<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnerActive - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>OnerActive</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-container">
        <div class="login-box">
            <h2>GOOD DAY</h2>
            <p>Login</p>
            
            <form id="loginForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
                
                <button type="submit">Login</button>

                <label for="demo">DEMO CREDENTIALS</label>
                <p id="demo">Username: admin | Password: admin123</p>
                <p id="demo">Username: customer | Password: customer123</p>
                
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 OnerActive. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
