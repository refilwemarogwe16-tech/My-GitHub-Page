<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - OnerActive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1> OnerActive | ADMIN</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#shop">Manage Shop</a></li>
                <li><a href="feedback.html">Manage Feedback</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <!-- Admin Shop Management -->
    <section id="shop" class="admin-shop">
        <h2>🛒 MANAGE PRODUCTS</h2>
        <div class="admin-section">
            <div class="add-product">
                <h3>Add New Product</h3>
                <form id="addProductForm">
                    <input type="text" id="prod-name" placeholder="Product Name" required>
                    <input type="text" id="prod-price" placeholder="Price (e.g., 49.99)" required>
                    <select id="prod-category">
                        <option value="Hoodie">Hoodie</option>
                        <option value="Leggings">Leggings</option>
                    </select>
                    <input type="file" id="prod-image" accept="image/*" required>
                    <button type="submit">Add Product</button>
                </form>
            </div>
            
            <div class="product-list">
                <h3>Current Products</h3>
                <div id="adminProductList">
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 OnerActive. Admin Dashboard</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
